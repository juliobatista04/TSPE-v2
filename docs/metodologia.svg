<line x1="870" y1="155.0" x2="908" y2="155.0" stroke="#65148C" stroke-width="2" marker-end="url(#a)"/>
<path d="M1035.0,230 L1035.0,275 L165.0,275 L165.0,318" fill="none" stroke="#65148C" stroke-width="2" marker-end="url(#a)"/>
<line x1="290" y1="395.0" x2="328" y2="395.0" stroke="#65148C" stroke-width="2" marker-end="url(#a)"/>
<line x1="580" y1="395.0" x2="618" y2="395.0" stroke="#65148C" stroke-width="2" marker-end="url(#a)"/>
